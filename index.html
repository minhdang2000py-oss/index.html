<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game kiểm tra tốc độ</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef1f5;
      color: #1b2433;
      text-align: center;
      min-height: 100vh;
    }
    h1 { margin: 0; padding: 16px 0 8px; font-size: 1.6rem; }

    /* Thông tin: điểm số và thời gian */
    #info { font-size: 1.3rem; font-weight: 600; margin-bottom: 10px; }
    #info span { color: #2f5bff; }

    #startBtn {
      font: inherit; font-weight: 600;
      padding: 10px 22px;
      border: 0; border-radius: 8px;
      background: #2f5bff; color: #fff; cursor: pointer;
    }
    #startBtn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Khu vực chơi: 600x400, định vị tuyệt đối, căn giữa ngang */
    #arena {
      position: absolute;
      left: 50%;
      top: 150px;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: #fff7d6;
      border: 3px solid #2f5bff;
      border-radius: 10px;
    }
    /* Khi hết giờ: khóa mọi thao tác trong khu vực chơi */
    #arena.locked { pointer-events: none; opacity: 0.6; }

    /* Mục tiêu: hình tròn nhỏ, định vị tuyệt đối trong #arena */
    #target {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #ff5a5f;
      border: 3px solid #b3261e;
      cursor: pointer;
      display: none;            /* ẩn cho tới khi bấm Bắt đầu */
    }

    /* Thông báo kết quả cuối game, nằm giữa khu vực chơi */
    #result {
      position: absolute;
      left: 0; right: 0; top: 40%;
      font-size: 2rem; font-weight: 700;
      color: #b3261e;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Game kiểm tra tốc độ</h1>

  <div id="info">
    Điểm: <span id="score">0</span> &nbsp;|&nbsp;
    Thời gian: <span id="time">30</span> giây
  </div>
  <button id="startBtn" type="button">Bắt đầu trò chơi</button>

  <div id="arena">
    <div id="target"></div>
    <div id="result"></div>
  </div>

  <script>
    const GAME_SECONDS = 30;       // thời gian một ván chơi
    const MOVE_EVERY_MS = 1000;    // mục tiêu tự đổi chỗ mỗi 1 giây nếu chưa click

    const arena = document.getElementById("arena");
    const target = document.getElementById("target");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const startBtn = document.getElementById("startBtn");
    const resultEl = document.getElementById("result");

    let score = 0;
    let timeLeft = GAME_SECONDS;
    let countdownId = null;   // id của bộ đếm ngược
    let moveId = null;        // id của bộ tự đổi vị trí

    // Đặt mục tiêu tại tọa độ top/left ngẫu nhiên trong #arena
    function moveTarget() {
      const maxLeft = arena.clientWidth - target.offsetWidth;
      const maxTop = arena.clientHeight - target.offsetHeight;
      target.style.left = Math.floor(Math.random() * maxLeft) + "px";
      target.style.top = Math.floor(Math.random() * maxTop) + "px";
    }

    // Bật bộ tự đổi vị trí mỗi 1 giây (xóa bộ cũ trước để không chạy chồng)
    function restartMoveTimer() {
      clearInterval(moveId);
      moveId = setInterval(moveTarget, MOVE_EVERY_MS);
    }

    function startGame() {
      score = 0;
      timeLeft = GAME_SECONDS;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      resultEl.style.display = "none";
      startBtn.disabled = true;
      target.style.display = "block";
      moveTarget();
      restartMoveTimer();
      countdownId = setInterval(function () {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      clearInterval(countdownId);
      clearInterval(moveId);
      target.style.display = "none";
      arena.classList.add("locked");        // khóa toàn bộ thao tác
      resultEl.textContent = "Hết giờ! Tổng điểm: " + score;
      resultEl.style.display = "block";
    }

    // Click trúng mục tiêu: +1 điểm, đổi vị trí ngay, tính lại 1 giây
    target.addEventListener("click", function () {
      score++;
      scoreEl.textContent = score;
      moveTarget();
      restartMoveTimer();
    });

    startBtn.addEventListener("click", startGame);
  </script>
</body>
</html>
